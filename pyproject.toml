[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "stability-gfn"
version = "0.1.0"
description = "Frozen ProGen2 guidance toward Mega-scale folding stability"
requires-python = ">=3.10"
dependencies = ["numpy==1.26.4", "torch==2.6.0", "transformers==4.27.4", "tokenizers==0.13.3", "biopython==1.86"]

[project.optional-dependencies]
dev = ["ruff==0.14.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"stability_gfn.vendor.progen" = ["*.json", "*.txt", "*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
extend-exclude = ["src/stability_gfn/vendor", "runs", "literature", ".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"src/stability_gfn/__main__.py" = ["E402"]
